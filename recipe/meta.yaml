{% set name = "pycatch22" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pycatch22-{{ version }}.tar.gz
  sha256: eb21e3d8be8fe0b4c3c4978330ead501d88a7bcbc6d072a345d7fb54eabb2a73

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python

test:
  imports:
    - pycatch22
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/pycatch22/
  summary: 22 CAnonical Time-series Features
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rpanai
